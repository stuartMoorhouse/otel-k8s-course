# Demo: a tiny Flask app that talks to Redis.
# Step 1 (lesson 05): deployed WITHOUT instrumentation, then annotated.
# Step 2 (lesson 06): Redis gets discovery annotations so the Collector scrapes it.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-code
  namespace: demo
data:
  app.py: |
    import os, redis
    from flask import Flask
    app = Flask(__name__)
    r = redis.Redis(host=os.getenv("REDIS_HOST", "redis"), port=6379)

    @app.route("/")
    def hello():
        n = r.incr("hits")
        return f"hello, hit number {n}\n"

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8080)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
      # Lesson 05: add the annotation by hand with kubectl patch (see lesson),
      # or uncomment:
      # annotations:
      #   instrumentation.opentelemetry.io/inject-python: "opentelemetry-operator-system/elastic-instrumentation"
    spec:
      containers:
        - name: web
          image: python:3.14-slim
          command: ["sh", "-c", "pip install --no-cache-dir flask redis && python /app/app.py"]
          env:
            - name: OTEL_SERVICE_NAME
              value: demo-web
          ports:
            - containerPort: 8080
          volumeMounts:
            - { name: code, mountPath: /app }
      volumes:
        - name: code
          configMap: { name: app-code }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
      # Lesson 06: apply manifests/redis-discovery-patch.yaml to add the hints
    spec:
      containers:
        - name: redis
          image: redis:8
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: demo
spec:
  selector: { app: redis }
  ports:
    - port: 6379
---
# Traffic generator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen }
    spec:
      containers:
        - name: loadgen
          image: curlimages/curl:8.23.0
          command: ["sh", "-c", "while true; do curl -s http://web.demo.svc/ ; sleep 1; done"]
